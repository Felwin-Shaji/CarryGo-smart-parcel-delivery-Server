services:
  backend:
    image: 183192605547.dkr.ecr.ap-south-1.amazonaws.com/carrygo-backend:${IMAGE_TAG}
    container_name: carrygo-backend
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: carrygo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
